<nav class="navbar navbar-expand-lg app-navbar">
  <div class="navbar-container">
    <!-- Logo -->
    <a class="navbar-brand" routerLink="/home">CinemaX</a>

    <!-- Toggle button for mobile -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar content -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <!-- Middle section - Common items -->
      <div class="navbar-middle" *ngIf="isUser && isAuthenticated">
        <a class="nav-link" routerLink="/movies" routerLinkActive="active">Movies</a>
      </div>

      <!-- Role-based items - Admin -->
      <div class="navbar-role-items" *ngIf="isAdmin && isAuthenticated">
        <a class="nav-link" routerLink="/admin" routerLinkActive="active">Dashboard</a>
        <a class="nav-link" routerLink="/admin/movies" routerLinkActive="active">Movies</a>
        <a class="nav-link" routerLink="/admin/halls" routerLinkActive="active">Halls</a>
        <a class="nav-link" routerLink="/admin/showtimes" routerLinkActive="active">Showtimes</a>
        <a class="nav-link" routerLink="/admin/menu" routerLinkActive="active">Menu</a>
        <a class="nav-link" routerLink="/admin/bookings" routerLinkActive="active">Bookings</a>
      </div>

      <!-- Right section - Auth buttons or logout -->
      <div class="navbar-right ms-auto">
        <div *ngIf="!isAuthenticated" class="auth-buttons">
          <a class="btn btn-outline-primary btn-sm" routerLink="/sign-in">Sign In</a>
          <a class="btn btn-primary btn-sm" routerLink="/sign-up">Sign Up</a>
        </div>

        <div *ngIf="isAuthenticated" class="auth-logout">
          <button type="button" class="btn btn-outline-danger btn-sm" (click)="logout()">
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>

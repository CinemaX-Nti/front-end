<div class="sign-in-container">
    <div class="sign-in-card">
        <h2>Sign In</h2>

        <form (ngSubmit)="onSignIn()">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" [(ngModel)]="email" name="email"
                    placeholder="Enter your email" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password"
                    placeholder="Enter your password" required />
            </div>

            <div *ngIf="errorMessage" class="alert alert-danger">
                {{ errorMessage }}
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="isSubmitting">
                {{ isSubmitting ? 'Signing In...' : 'Sign In' }}
            </button>
        </form>

        <div class="sign-in-links">
            <a routerLink="/user/auth/forgot-password">Forgot Password?</a>
            <span>•</span>
            <a routerLink="/user/auth/sign-up">Create Account</a>
        </div>

        <p class="hint-text">
            <small>Tip: Use "admin" in email for admin role, otherwise user role</small>
        </p>
    </div>
</div>

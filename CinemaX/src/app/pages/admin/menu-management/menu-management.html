<div class="admin-dashboard-container">
  <!-- Header Section -->
  <div class="dashboard-header">
    <div class="header-titles">
      <h1 class="page-title">Menu Management</h1>
      <p class="page-subtitle">Manage snacks, beverages, and combos</p>
    </div>
    <div class="header-actions">
      <button class="btn-primary-add" (click)="openAddModal()">
        <span class="plus-icon">+</span> Add Menu Item
      </button>
    </div>
  </div>

  <!-- Filters Section -->
  <div class="filters-bar">
    <div class="search-container">
      <i class="search-icon">🔍</i>
      <input 
        type="text" 
        class="search-input" 
        placeholder="Search menu items..." 
        [(ngModel)]="searchQuery"
        (input)="applyFilters()"
      >
    </div>
    
    <div class="category-pills">
      <button class="category-pill" [class.active]="selectedCategory === 'ALL'" (click)="setCategory('ALL')">All</button>
      <button class="category-pill" [class.active]="selectedCategory === 'SNACK'" (click)="setCategory('SNACK')">Snacks</button>
      <button class="category-pill" [class.active]="selectedCategory === 'BEVERAGE'" (click)="setCategory('BEVERAGE')">Beverages</button>
      <button class="category-pill" [class.active]="selectedCategory === 'COMBO'" (click)="setCategory('COMBO')">Combos</button>
    </div>
  </div>

  <!-- Grid Section -->
  <div class="menu-grid">
    <div class="menu-card" *ngFor="let item of filteredItems" [class.unavailable]="!item.isAvailable">
      <div class="menu-card-header">
        <span class="category-tag" [ngClass]="'tag-' + item.category.toLowerCase()">{{ item.category }}</span>
        <div class="card-actions">
          <button class="btn-icon" (click)="toggleAvailability(item)" title="Toggle Availability">
            {{ item.isAvailable ? '👁️' : '🚫' }}
          </button>
          <button class="btn-icon delete" (click)="deleteItem(item)" title="Delete Item">
            🗑️
          </button>
        </div>
      </div>
      
      <div class="menu-card-body">
        <h3 class="item-name">{{ item.name }}</h3>
        <p class="item-desc">{{ item.description }}</p>
      </div>
      
      <div class="menu-card-footer">
        <div class="price">${{ item.price | number:'1.2-2' }}</div>
        <div class="status-indicator">
          <span class="dot" [class.active]="item.isAvailable"></span>
          {{ item.isAvailable ? 'Available' : 'Out of Stock' }}
        </div>
      </div>
    </div>
    
    <div class="empty-state" *ngIf="filteredItems.length === 0">
      <p>No menu items found matching your filters.</p>
    </div>
  </div>

  <!-- Add Menu Item Modal -->
  <div class="modal-overlay" *ngIf="isAddModalOpen" (click)="closeAddModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>Add New Menu Item</h2>
        <button class="btn-close" (click)="closeAddModal()">✕</button>
      </div>
      
      <div class="modal-body">
        <div class="form-group">
          <label>Name</label>
          <input type="text" [(ngModel)]="newItem.name" class="form-control" placeholder="e.g. Popcorn Combo">
        </div>
        
        <div class="form-row">
          <div class="form-group half">
            <label>Category</label>
            <select [(ngModel)]="newItem.category" class="form-control">
              <option value="SNACK">Snack</option>
              <option value="BEVERAGE">Beverage</option>
              <option value="COMBO">Combo</option>
            </select>
          </div>
          
          <div class="form-group half">
            <label>Price ($)</label>
            <input type="number" [(ngModel)]="newItem.price" class="form-control" min="0" step="0.5">
          </div>
        </div>
        
        <div class="form-group">
          <label>Description</label>
          <textarea [(ngModel)]="newItem.description" class="form-control" rows="3" placeholder="Brief description of the item"></textarea>
        </div>
        
        <div class="form-group checkbox-group">
          <input type="checkbox" id="isAvailable" [(ngModel)]="newItem.isAvailable">
          <label for="isAvailable">Item is available for sale immediately</label>
        </div>
      </div>
      
      <div class="modal-footer">
        <button class="btn-cancel" (click)="closeAddModal()">Cancel</button>
        <button class="btn-save" (click)="saveNewItem()">Save Item</button>
      </div>
    </div>
  </div>
</div>
